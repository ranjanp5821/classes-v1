<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 680" width="700" height="680">
  <defs>
    <linearGradient id="accI1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="700" height="680" fill="#FFFFFF"/>

  <!-- institution building glyph -->
  <g transform="translate(350,44)">
    <polygon points="0,0 60,32 -60,32" fill="none" stroke="#1E293B" stroke-width="3"/>
    <rect x="-50" y="32" width="100" height="60" fill="none" stroke="#1E293B" stroke-width="3"/>
    <line x1="-34" y1="46" x2="-34" y2="92" stroke="#1E293B" stroke-width="2.4"/>
    <line x1="-12" y1="46" x2="-12" y2="92" stroke="#1E293B" stroke-width="2.4"/>
    <line x1="10" y1="46" x2="10" y2="92" stroke="#1E293B" stroke-width="2.4"/>
    <line x1="32" y1="46" x2="32" y2="92" stroke="#1E293B" stroke-width="2.4"/>
  </g>

  <text x="350" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1E293B">Leadership View</text>

  <!-- 2x2 dashboard grid -->
  <g transform="translate(110,220)">
    <!-- Teaching & curriculum progress -->
    <g>
      <rect x="0" y="0" width="230" height="200" rx="14" fill="#fff" stroke="url(#accI1)" stroke-width="2"/>
      <text x="20" y="34" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Teaching &amp; Curriculum</text>
      <path d="M 20 100 C 45 80, 55 110, 80 92 S 120 60, 150 96 S 190 70 210 90" fill="none" stroke="url(#accI1)" stroke-width="3.4" stroke-linecap="round"/>
      <text x="20" y="176" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="url(#accI1)">82%</text>
      <text x="70" y="176" font-family="Arial, sans-serif" font-size="11" fill="#64748B">syllabus paced</text>
    </g>

    <!-- Student learning visibility -->
    <g transform="translate(250,0)">
      <rect x="0" y="0" width="230" height="200" rx="14" fill="#fff" stroke="url(#accI1)" stroke-width="2"/>
      <text x="20" y="34" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Student Learning</text>
      <g stroke="#94A3B8" stroke-width="2" fill="none">
        <circle cx="45" cy="90" r="17"/>
        <circle cx="90" cy="80" r="17"/>
        <circle cx="135" cy="95" r="17"/>
      </g>
      <circle cx="180" cy="82" r="20" fill="none" stroke="url(#accI1)" stroke-width="3"/>
      <text x="20" y="176" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="url(#accI1)">96%</text>
      <text x="70" y="176" font-family="Arial, sans-serif" font-size="11" fill="#64748B">visible progress</text>
    </g>

    <!-- Assessments & learning gaps -->
    <g transform="translate(0,220)">
      <rect x="0" y="0" width="230" height="200" rx="14" fill="#fff" stroke="url(#accI1)" stroke-width="2"/>
      <text x="20" y="34" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Assessments &amp; Gaps</text>
      <g transform="translate(30,60)">
        <rect x="0" y="50" width="26" height="50" fill="#CBD5E1"/>
        <rect x="36" y="30" width="26" height="70" fill="url(#accI1)"/>
        <rect x="72" y="60" width="26" height="40" fill="#F59E0B"/>
        <rect x="108" y="14" width="26" height="86" fill="url(#accI1)"/>
      </g>
      <text x="20" y="176" font-family="Arial, sans-serif" font-size="11" fill="#64748B">3 topics need attention</text>
    </g>

    <!-- Recommended institutional priorities -->
    <g transform="translate(250,220)">
      <rect x="0" y="0" width="230" height="200" rx="14" fill="#fff" stroke="url(#accI1)" stroke-width="2"/>
      <text x="20" y="34" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Recommended Priorities</text>
      <g font-family="Arial, sans-serif" font-size="12" fill="#334155">
        <circle cx="26" cy="66" r="4" fill="url(#accI1)"/>
        <text x="40" y="70">Reinforce Grade 8 Algebra</text>
        <circle cx="26" cy="96" r="4" fill="url(#accI1)"/>
        <text x="40" y="100">Review Science Faculty pace</text>
        <circle cx="26" cy="126" r="4" fill="url(#accI1)"/>
        <text x="40" y="130">Support 42 flagged students</text>
      </g>
    </g>
  </g>
</svg>
