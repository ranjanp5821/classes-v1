<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" width="1400" height="460">
  <defs>
    <linearGradient id="accI7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="460" fill="#FFFFFF"/>

  <!-- existing systems, left -->
  <g font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">
    <g transform="translate(150,140)">
      <rect x="-46" y="-32" width="92" height="64" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="-30" y="-18" width="60" height="10" rx="2" fill="#E2E8F0"/>
      <rect x="-30" y="-2" width="40" height="10" rx="2" fill="#E2E8F0"/>
      <text y="52" text-anchor="middle">Attendance system</text>
    </g>
    <g transform="translate(150,240)">
      <rect x="-46" y="-32" width="92" height="64" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="2"/>
      <circle cx="0" cy="-8" r="14" fill="none" stroke="#E2E8F0" stroke-width="6"/>
      <text y="52" text-anchor="middle">Student records</text>
    </g>
    <g transform="translate(150,340)">
      <rect x="-46" y="-32" width="92" height="64" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="-24" y1="-14" x2="24" y2="-14" stroke="#E2E8F0" stroke-width="6"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#E2E8F0" stroke-width="6"/>
      <line x1="-24" y1="14" x2="10" y2="14" stroke="#E2E8F0" stroke-width="6"/>
      <text y="52" text-anchor="middle">Existing spreadsheets</text>
    </g>
  </g>

  <!-- converging dashed lines -->
  <g stroke="url(#accI7)" stroke-width="2" stroke-dasharray="1 8" fill="none" opacity="0.75">
    <path d="M 196 140 C 380 140, 420 230, 600 230"/>
    <path d="M 196 240 C 420 240, 460 230, 600 230"/>
    <path d="M 196 340 C 380 340, 420 240, 600 230"/>
  </g>

  <!-- hub -->
  <g transform="translate(680,230)">
    <circle r="70" fill="#fff" stroke="url(#accI7)" stroke-width="3"/>
    <text y="-4" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1E293B">Classess</text>
    <text y="18" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="url(#accI7)">.com</text>
  </g>

  <!-- phases, right -->
  <g font-family="Arial, sans-serif" fill="#334155">
    <line x1="760" y1="230" x2="1340" y2="230" stroke="url(#accI7)" stroke-width="2.4" stroke-dasharray="1 10" opacity="0.8"/>

    <g transform="translate(880,230)">
      <circle r="20" fill="url(#accI7)"/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
      <text y="-32" text-anchor="middle" font-size="12" font-weight="700">Pilot rollout</text>
    </g>
    <g transform="translate(1090,230)">
      <circle r="20" fill="#fff" stroke="url(#accI7)" stroke-width="3"/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="url(#accI7)">2</text>
      <text y="42" text-anchor="middle" font-size="12" font-weight="700">Full department</text>
    </g>
    <g transform="translate(1300,230)">
      <circle r="22" fill="#fff" stroke="#CBD5E1" stroke-width="3"/>
      <text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#94A3B8">3</text>
      <text y="-34" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B">Institution-wide</text>
    </g>
  </g>
</svg>
