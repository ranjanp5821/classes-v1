<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <defs>
    <linearGradient id="accI6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="700" height="900" fill="#FFFFFF"/>

  <g transform="translate(90,80)">
    <rect x="0" y="0" width="520" height="740" rx="18" fill="#fff" stroke="url(#accI6)" stroke-width="2.4"/>

    <!-- tab switcher -->
    <g font-family="Arial, sans-serif" font-size="11.5" font-weight="700">
      <rect x="24" y="26" width="110" height="30" rx="8" fill="url(#accI6)"/>
      <text x="79" y="46" text-anchor="middle" fill="#fff">Campus</text>
      <rect x="140" y="26" width="100" height="30" rx="8" fill="none" stroke="#E2E8F0" stroke-width="1.6"/>
      <text x="190" y="46" text-anchor="middle" fill="#94A3B8">Group</text>
      <rect x="246" y="26" width="90" height="30" rx="8" fill="none" stroke="#E2E8F0" stroke-width="1.6"/>
      <text x="291" y="46" text-anchor="middle" fill="#94A3B8">NGO</text>
      <rect x="342" y="26" width="100" height="30" rx="8" fill="none" stroke="#E2E8F0" stroke-width="1.6"/>
      <text x="392" y="46" text-anchor="middle" fill="#94A3B8">District</text>
    </g>

    <!-- KPI tiles -->
    <g font-family="Arial, sans-serif">
      <g transform="translate(24,90)">
        <rect width="150" height="86" rx="10" fill="#F5F5FF"/>
        <text x="16" y="30" font-size="22" font-weight="700" fill="url(#accI6)">1,240</text>
        <text x="16" y="52" font-size="11" fill="#64748B">active students</text>
      </g>
      <g transform="translate(186,90)">
        <rect width="150" height="86" rx="10" fill="#F5F5FF"/>
        <text x="16" y="30" font-size="22" font-weight="700" fill="url(#accI6)">86%</text>
        <text x="16" y="52" font-size="11" fill="#64748B">syllabus coverage</text>
      </g>
      <g transform="translate(348,90)">
        <rect width="148" height="86" rx="10" fill="#F5F5FF"/>
        <text x="16" y="30" font-size="22" font-weight="700" fill="url(#accI6)">57</text>
        <text x="16" y="52" font-size="11" fill="#64748B">flagged learners</text>
      </g>
    </g>

    <!-- trend chart -->
    <g transform="translate(24,210)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1E293B">Academic outcomes over term</text>
      <line x1="0" y1="230" x2="472" y2="230" stroke="#E2E8F0" stroke-width="1.6"/>
      <line x1="0" y1="150" x2="472" y2="150" stroke="#F1F5F9" stroke-width="1.2"/>
      <line x1="0" y1="70" x2="472" y2="70" stroke="#F1F5F9" stroke-width="1.2"/>
      <polyline points="0,190 80,170 160,140 240,150 320,90 400,60 472,40"
                fill="none" stroke="url(#accI6)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="url(#accI6)">
        <circle cx="0" cy="190" r="5"/>
        <circle cx="160" cy="140" r="5"/>
        <circle cx="320" cy="90" r="5"/>
        <circle cx="472" cy="40" r="6"/>
      </g>
    </g>

    <!-- bottom priority list -->
    <g transform="translate(24,478)" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">
      <text font-weight="700" font-size="13" fill="#1E293B">Priorities this week</text>
      <circle cx="6" cy="30" r="4" fill="url(#accI6)"/>
      <text x="20" y="34">Grade 9 Physics pacing behind plan</text>
      <circle cx="6" cy="60" r="4" fill="url(#accI6)"/>
      <text x="20" y="64">Feedback pending on 3 assessments</text>
      <circle cx="6" cy="90" r="4" fill="url(#accI6)"/>
      <text x="20" y="94">Intervention review due — Section B</text>
    </g>
  </g>
</svg>
