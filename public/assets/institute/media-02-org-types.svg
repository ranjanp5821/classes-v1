<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <defs>
    <linearGradient id="accI2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="760" height="460" fill="#FFFFFF"/>

  <!-- connecting spokes -->
  <g stroke="url(#accI2)" stroke-width="2" stroke-dasharray="1 8" opacity="0.7">
    <line x1="380" y1="230" x2="180" y2="110"/>
    <line x1="380" y1="230" x2="580" y2="110"/>
    <line x1="380" y1="230" x2="180" y2="350"/>
    <line x1="380" y1="230" x2="580" y2="350"/>
  </g>

  <!-- hub -->
  <g transform="translate(380,230)">
    <circle r="56" fill="#fff" stroke="url(#accI2)" stroke-width="3"/>
    <text y="-4" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1E293B">Classess</text>
    <text y="14" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="url(#accI2)">.com</text>
  </g>

  <!-- Independent campus -->
  <g transform="translate(180,100)">
    <circle r="46" fill="#fff" stroke="url(#accI2)" stroke-width="2.2"/>
    <g transform="translate(0,-6)" stroke="#1E293B" stroke-width="2" fill="none">
      <polygon points="0,-16 18,-4 -18,-4"/>
      <rect x="-15" y="-4" width="30" height="20"/>
    </g>
    <text y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Independent Campus</text>
  </g>

  <!-- Education group -->
  <g transform="translate(580,100)">
    <circle r="46" fill="#fff" stroke="url(#accI2)" stroke-width="2.2"/>
    <g transform="translate(0,-4)" stroke="#1E293B" stroke-width="1.9" fill="none">
      <rect x="-20" y="-4" width="15" height="22"/>
      <rect x="-2" y="-12" width="15" height="30"/>
      <rect x="17" y="-2" width="13" height="20"/>
    </g>
    <text y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Education Group</text>
  </g>

  <!-- NGO / CSR -->
  <g transform="translate(180,360)">
    <circle r="46" fill="#fff" stroke="url(#accI2)" stroke-width="2.2"/>
    <path d="M 0 10 C -18 -4, -25 -25, -10 -28 C 0 -30, 0 -21, 0 -18 C 0 -21, 0 -30, 10 -28 C 25 -25, 18 -4, 0 10 Z"
          fill="none" stroke="#1E293B" stroke-width="1.9" transform="translate(0,-2)"/>
    <text y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">NGO / CSR Programme</text>
  </g>

  <!-- District system -->
  <g transform="translate(580,360)">
    <circle r="46" fill="#fff" stroke="url(#accI2)" stroke-width="2.2"/>
    <g stroke="#1E293B" stroke-width="1.9" fill="none">
      <circle cx="-13" cy="-6" r="5"/>
      <circle cx="13" cy="-6" r="5"/>
      <circle cx="0" cy="11" r="5"/>
      <line x1="-13" y1="-6" x2="13" y2="-6"/>
      <line x1="-13" y1="-6" x2="0" y2="11"/>
      <line x1="13" y1="-6" x2="0" y2="11"/>
    </g>
    <text y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">District System</text>
  </g>
</svg>
