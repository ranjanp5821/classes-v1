<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg04" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="acc04" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg04)"/>
  <!-- flashcard stack -->
  <g>
    <rect x="150" y="260" width="220" height="140" rx="16" fill="#DDE3F0" transform="rotate(-6 260 330)"/>
    <rect x="160" y="250" width="220" height="140" rx="16" fill="#fff" stroke="#C7CEE0" stroke-width="2" transform="rotate(-2 270 320)"/>
    <g transform="rotate(-2 270 320)">
      <text x="270" y="300" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#1E293B">a&#178; + b&#178; = ?</text>
      <line x1="200" y1="330" x2="340" y2="330" stroke="#E2E8F0" stroke-width="2"/>
      <text x="270" y="360" text-anchor="middle" font-family="Arial" font-size="12" fill="#94A3B8">Tap to reveal</text>
    </g>
  </g>
  <!-- quiz checklist card -->
  <g transform="translate(430,180)">
    <rect x="0" y="0" width="240" height="200" rx="16" fill="#fff" stroke="#DDE3F0" stroke-width="2"/>
    <rect x="20" y="24" width="200" height="14" rx="4" fill="#1E293B" opacity="0.75"/>
    <g>
      <rect x="20" y="60" width="18" height="18" rx="4" fill="url(#acc04)"/>
      <path d="M 24 69 l 4 4 l 8 -9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="62" width="160" height="12" rx="3" fill="#E2E8F0"/>
    </g>
    <g>
      <rect x="20" y="98" width="18" height="18" rx="4" fill="#fff" stroke="#C7CEE0" stroke-width="2"/>
      <rect x="46" y="100" width="130" height="12" rx="3" fill="#E2E8F0"/>
    </g>
    <g>
      <rect x="20" y="136" width="18" height="18" rx="4" fill="#fff" stroke="#C7CEE0" stroke-width="2"/>
      <rect x="46" y="138" width="150" height="12" rx="3" fill="#E2E8F0"/>
    </g>
    <rect x="20" y="168" width="200" height="16" rx="8" fill="url(#acc04)"/>
  </g>
  <!-- pencil -->
  <g transform="translate(200,440) rotate(-35)">
    <rect x="0" y="0" width="140" height="22" rx="4" fill="url(#acc04)"/>
    <polygon points="140,0 165,11 140,22" fill="#FBBF24"/>
    <rect x="-14" y="0" width="14" height="22" fill="#94A3B8"/>
  </g>
</svg>
