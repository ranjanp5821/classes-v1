<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg06" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="acc06" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg06)"/>
  <!-- rising line chart -->
  <polyline points="120,420 260,380 380,320 500,230 640,150"
            fill="none" stroke="url(#acc06)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="url(#acc06)">
    <circle cx="120" cy="420" r="9"/>
    <circle cx="260" cy="380" r="9"/>
    <circle cx="380" cy="320" r="9"/>
    <circle cx="500" cy="230" r="9"/>
    <circle cx="640" cy="150" r="11"/>
  </g>
  <!-- baseline -->
  <line x1="90" y1="470" x2="700" y2="470" stroke="#CBD5E1" stroke-width="2"/>
  <!-- milestone flag at the top -->
  <g transform="translate(640,150)">
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#94A3B8" stroke-width="3"/>
    <path d="M 0 -60 L 34 -48 L 0 -36 Z" fill="#22C55E"/>
  </g>
  <!-- labels -->
  <g font-family="Arial" font-size="13" fill="#64748B">
    <text x="120" y="446" text-anchor="middle">Previously</text>
    <text x="380" y="346" text-anchor="middle">Now</text>
    <text x="640" y="128" text-anchor="middle" font-weight="700" fill="#1E293B">Next Step</text>
  </g>
</svg>
