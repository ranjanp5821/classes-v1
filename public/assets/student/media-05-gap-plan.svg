<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg05" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="acc05" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg05)"/>
  <!-- bar chart -->
  <g transform="translate(140,240)">
    <rect x="0" y="120" width="46" height="80" rx="6" fill="#94A3B8"/>
    <rect x="66" y="70" width="46" height="130" rx="6" fill="url(#acc05)"/>
    <rect x="132" y="150" width="46" height="50" rx="6" fill="#F59E0B"/>
    <rect x="198" y="40" width="46" height="160" rx="6" fill="url(#acc05)"/>
    <line x1="-10" y1="200" x2="260" y2="200" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  <!-- magnifying glass over the weak bar -->
  <g transform="translate(272,330)">
    <circle cx="0" cy="0" r="36" fill="#fff" stroke="url(#acc05)" stroke-width="6"/>
    <line x1="26" y1="26" x2="50" y2="50" stroke="url(#acc05)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4"/>
  </g>
  <!-- calendar / study plan -->
  <g transform="translate(460,180)">
    <rect x="0" y="0" width="240" height="220" rx="16" fill="#fff" stroke="#DDE3F0" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="42" rx="16" fill="url(#acc05)"/>
    <text x="120" y="27" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">This Week's Plan</text>
    <g font-family="Arial" font-size="12" fill="#475569">
      <text x="18" y="72">Mon</text><rect x="60" y="60" width="150" height="14" rx="6" fill="#E2E8F0"/>
      <text x="18" y="102">Tue</text><rect x="60" y="90" width="120" height="14" rx="6" fill="#E2E8F0"/>
      <text x="18" y="132">Wed</text><rect x="60" y="120" width="150" height="14" rx="6" fill="url(#acc05)" opacity="0.85"/>
      <text x="18" y="162">Thu</text><rect x="60" y="150" width="100" height="14" rx="6" fill="#E2E8F0"/>
      <text x="18" y="192">Fri</text><rect x="60" y="180" width="140" height="14" rx="6" fill="#E2E8F0"/>
    </g>
  </g>
</svg>
