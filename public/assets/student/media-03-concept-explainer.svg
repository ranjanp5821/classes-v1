<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 860" width="700" height="860">
  <defs>
    <linearGradient id="bg03" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="acc03" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="700" height="860" fill="url(#bg03)"/>
  <!-- speech bubble with sparkle (explain another way) -->
  <g transform="translate(150,60)">
    <rect x="0" y="0" width="140" height="60" rx="16" fill="url(#acc03)"/>
    <path d="M 20 60 l 0 22 l 26 -22 Z" fill="url(#acc03)"/>
    <text x="70" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Explain again?</text>
  </g>
  <!-- right triangle -->
  <polygon points="260,380 460,380 260,180" fill="none" stroke="url(#acc03)" stroke-width="6" stroke-linejoin="round"/>
  <rect x="236" y="356" width="24" height="24" fill="none" stroke="url(#acc03)" stroke-width="4"/>
  <text x="360" y="405" text-anchor="middle" font-family="monospace" font-size="18" fill="#475569">a</text>
  <text x="230" y="280" text-anchor="middle" font-family="monospace" font-size="18" fill="#475569">b</text>
  <text x="390" y="260" text-anchor="middle" font-family="monospace" font-size="18" fill="#4F46E5" font-weight="700">c</text>
  <!-- formula card -->
  <g transform="translate(160,620)">
    <rect x="0" y="0" width="220" height="90" rx="14" fill="#fff" stroke="#DDE3F0" stroke-width="2"/>
    <text x="110" y="52" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#1E293B">a&#178; + b&#178; = c&#178;</text>
  </g>
  <!-- lightbulb -->
  <g transform="translate(500,665)">
    <circle cx="0" cy="0" r="40" fill="#fff" stroke="url(#acc03)" stroke-width="4"/>
    <path d="M -14 -8 a 14 14 0 1 1 28 0 c 0 8 -6 10 -6 18 h -16 c 0 -8 -6 -10 -6 -18 Z" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linejoin="round"/>
    <line x1="-8" y1="16" x2="8" y2="16" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
