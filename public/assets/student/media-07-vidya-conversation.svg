<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg07" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="acc07" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg07)"/>
  <!-- Vidya avatar -->
  <g transform="translate(220,220)">
    <circle cx="0" cy="0" r="58" fill="url(#acc07)"/>
    <path d="M -6 -22 L 6 -22 L 6 -6 L 22 -6 L 22 6 L 6 6 L 6 22 L -6 22 L -6 6 L -22 6 L -22 -6 L -6 -6 Z" fill="#fff" opacity="0.95"/>
  </g>
  <text x="220" y="308" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1E293B">Vidya</text>
  <text x="220" y="328" text-anchor="middle" font-family="Arial" font-size="12" fill="#94A3B8">AI Learning Companion</text>

  <!-- chat bubbles -->
  <g>
    <rect x="330" y="140" width="330" height="70" rx="18" fill="#fff" stroke="#DDE3F0" stroke-width="2"/>
    <path d="M 330 190 l -18 16 l 18 6 Z" fill="#fff" stroke="#DDE3F0" stroke-width="2"/>
    <text x="352" y="170" font-family="Arial" font-size="13" fill="#334155">I understand the formula, but</text>
    <text x="352" y="190" font-family="Arial" font-size="13" fill="#334155">I do not know when to use it.</text>
  </g>
  <g>
    <rect x="390" y="240" width="330" height="86" rx="18" fill="url(#acc07)"/>
    <path d="M 720 290 l 18 16 l -18 6 Z" fill="url(#acc07)"/>
    <text x="412" y="266" font-family="Arial" font-size="13" fill="#fff">Let us look at a situation where</text>
    <text x="412" y="286" font-family="Arial" font-size="13" fill="#fff">the formula applies. What has</text>
    <text x="412" y="306" font-family="Arial" font-size="13" fill="#fff">been given in the question?</text>
  </g>

  <!-- voice waveform -->
  <g transform="translate(340,420)" fill="url(#acc07)">
    <rect x="0" y="-10" width="6" height="20" rx="3"/>
    <rect x="14" y="-22" width="6" height="44" rx="3"/>
    <rect x="28" y="-6" width="6" height="12" rx="3"/>
    <rect x="42" y="-28" width="6" height="56" rx="3"/>
    <rect x="56" y="-16" width="6" height="32" rx="3"/>
    <rect x="70" y="-24" width="6" height="48" rx="3"/>
    <rect x="84" y="-10" width="6" height="20" rx="3"/>
    <rect x="98" y="-18" width="6" height="36" rx="3"/>
  </g>
</svg>
