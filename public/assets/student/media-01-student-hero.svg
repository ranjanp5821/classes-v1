<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg01" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="acc01" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg01)"/>
  <!-- Desk surface -->
  <rect x="0" y="460" width="800" height="140" fill="#DDE3F0"/>
  <!-- Laptop base -->
  <rect x="220" y="430" width="360" height="20" rx="6" fill="#C7CEE0"/>
  <!-- Laptop screen -->
  <rect x="250" y="180" width="300" height="250" rx="14" fill="#1E293B"/>
  <rect x="266" y="196" width="268" height="218" rx="4" fill="#F8FAFC"/>
  <!-- Dashboard header -->
  <rect x="282" y="212" width="140" height="14" rx="4" fill="url(#acc01)"/>
  <circle cx="500" cy="219" r="7" fill="#22C55E"/>
  <!-- Progress ring -->
  <circle cx="330" cy="290" r="42" fill="none" stroke="#E2E8F0" stroke-width="10"/>
  <circle cx="330" cy="290" r="42" fill="none" stroke="url(#acc01)" stroke-width="10" stroke-dasharray="185 264" stroke-linecap="round" transform="rotate(-90 330 290)"/>
  <text x="330" y="296" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#1E293B">68%</text>
  <!-- Task rows -->
  <rect x="392" y="256" width="128" height="16" rx="4" fill="#E2E8F0"/>
  <rect x="392" y="282" width="100" height="16" rx="4" fill="#E2E8F0"/>
  <rect x="392" y="308" width="112" height="16" rx="4" fill="url(#acc01)" opacity="0.85"/>
  <!-- Bottom CTA bar -->
  <rect x="282" y="352" width="252" height="40" rx="10" fill="url(#acc01)"/>
  <rect x="300" y="368" width="120" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
  <!-- floating book icon -->
  <g transform="translate(150,240)">
    <rect x="0" y="0" width="70" height="52" rx="8" fill="#FFFFFF" stroke="#C7CEE0" stroke-width="2"/>
    <line x1="35" y1="6" x2="35" y2="46" stroke="#C7CEE0" stroke-width="2"/>
    <line x1="10" y1="16" x2="28" y2="16" stroke="url(#acc01)" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="28" x2="28" y2="28" stroke="url(#acc01)" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="16" x2="60" y2="16" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="28" x2="60" y2="28" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- floating target badge -->
  <g transform="translate(600,300)">
    <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#C7CEE0" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#acc01)" stroke-width="4"/>
    <circle cx="0" cy="0" r="8" fill="url(#acc01)"/>
  </g>
</svg>
