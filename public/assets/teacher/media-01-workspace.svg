<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <defs>
    <linearGradient id="accT1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#1CA363"/>
    </linearGradient>
  </defs>
  <rect width="700" height="900" fill="#FFFFFF"/>

  <!-- ═══ Top: teacher holding workspace tablet ═══ -->
  <g>
    <circle cx="180" cy="130" r="44" fill="none" stroke="#1E293B" stroke-width="3"/>
    <circle cx="195" cy="119" r="6.5" fill="none" stroke="#1E293B" stroke-width="2.4"/>
    <path d="M 152 110 q 18 -30 56 -6" fill="none" stroke="#1E293B" stroke-width="3"/>
    <path d="M 112 244 q 10 -66 68 -74 q 58 8 68 74 Z" fill="none" stroke="#1E293B" stroke-width="3"/>

    <g transform="translate(210,140) rotate(-4)">
      <rect x="0" y="0" width="300" height="190" rx="16" fill="#fff" stroke="#1E293B" stroke-width="3"/>
      <rect x="18" y="16" width="264" height="26" rx="4" fill="url(#accT1)"/>
      <text x="150" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" letter-spacing="0.5">WORKSPACE SIMPLIFICATION</text>

      <path d="M 30 84 C 55 64, 65 94, 90 79 S 130 54, 150 89" fill="none" stroke="url(#accT1)" stroke-width="4" stroke-linecap="round"/>
      <text x="30" y="112" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">AUTOMATED PLANNER</text>
      <text x="170" y="112" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">INFINITE DASHBOARD</text>

      <line x1="18" y1="132" x2="282" y2="132" stroke="#E2E8F0" stroke-width="2"/>
      <text x="30" y="160" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">CURRICULUM MAPPING</text>
      <text x="170" y="160" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">ASSESSMENT ENGINE</text>
    </g>

    <rect x="122" y="278" width="128" height="16" rx="4" fill="#1E293B"/>
    <g transform="translate(92,278)">
      <rect x="0" y="0" width="68" height="50" rx="6" fill="url(#accT1)"/>
      <path d="M 0 44 q 18 15 34 0 q 18 15 34 0" fill="none" stroke="#0F7A46" stroke-width="2"/>
    </g>
  </g>

  <!-- ═══ Middle: ribbon headline ═══ -->
  <path id="ribbon" d="M 55 470 C 190 428, 250 522, 390 490 S 560 428, 650 448"
        fill="none" stroke="none"/>
  <path d="M 55 470 C 190 428, 250 522, 390 490 S 560 428, 650 448"
        fill="none" stroke="url(#accT1)" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round" opacity="0.55"/>
  <text font-family="Georgia, serif" font-size="30" font-style="italic" font-weight="700" fill="#1E293B">
    <textPath href="#ribbon" startOffset="4%">Manage Less, Learn More</textPath>
  </text>

  <!-- Icon A — Lesson Creation: sits BELOW the ribbon, tail pointing up to it -->
  <g transform="translate(195,565)">
    <text x="0" y="-72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.3">LESSON CREATION</text>
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#accT1)" stroke-width="2.5"/>
    <rect x="-15" y="-13" width="30" height="24" rx="3" fill="none" stroke="url(#accT1)" stroke-width="2.5"/>
    <path d="M -15 -6 h 30 M -6 -13 v 24" stroke="url(#accT1)" stroke-width="1.6"/>
    <circle cx="-8" cy="-52" r="3" fill="url(#accT1)" opacity="0.55"/>
    <circle cx="-2" cy="-42" r="2" fill="url(#accT1)" opacity="0.55"/>
  </g>

  <!-- Icon B — Meaningful Feedback: sits ABOVE the ribbon, inverted, tail pointing down to it -->
  <g transform="translate(505,405)">
    <text x="0" y="-46" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.3">MEANINGFUL FEEDBACK</text>
    <g transform="scale(1,-1)">
      <circle cx="0" cy="0" r="36" fill="none" stroke="url(#accT1)" stroke-width="2.5"/>
      <path d="M -13 -3 a 13 13 0 1 0 26 0" fill="none" stroke="url(#accT1)" stroke-width="2.3" stroke-linecap="round"/>
      <circle cx="-9" cy="6" r="2.4" fill="url(#accT1)"/>
      <circle cx="9" cy="6" r="2.4" fill="url(#accT1)"/>
      <path d="M 16 14 l 10 -10 l 5 5 l -10 10 Z" fill="url(#accT1)"/>
      <circle cx="6" cy="52" r="3" fill="url(#accT1)" opacity="0.55"/>
      <circle cx="0" cy="42" r="2" fill="url(#accT1)" opacity="0.55"/>
    </g>
  </g>

  <!-- ═══ Bottom: two students with a shared tablet ═══ -->
  <g transform="translate(0,600)">
    <g transform="translate(190,145)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#1E293B" stroke-width="3"/>
      <path d="M -50 150 q 0 -90 50 -100 q 50 10 50 100 Z" fill="none" stroke="#1E293B" stroke-width="3"/>
    </g>
    <g transform="translate(290,158)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#1E293B" stroke-width="3"/>
      <path d="M -50 150 q 0 -90 50 -100 q 50 10 50 100 Z" fill="none" stroke="#1E293B" stroke-width="3"/>
    </g>

    <g transform="translate(200,190) rotate(6)">
      <rect x="0" y="0" width="130" height="90" rx="10" fill="#fff" stroke="#1E293B" stroke-width="3"/>
      <rect x="14" y="16" width="60" height="8" rx="3" fill="url(#accT1)"/>
      <rect x="14" y="34" width="102" height="6" rx="3" fill="#E2E8F0"/>
      <rect x="14" y="48" width="80" height="6" rx="3" fill="#E2E8F0"/>
      <rect x="14" y="66" width="40" height="14" rx="4" fill="url(#accT1)"/>
    </g>
  </g>
</svg>
