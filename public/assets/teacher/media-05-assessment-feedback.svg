<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 950" width="700" height="950">
  <defs>
    <linearGradient id="accT5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#1CA363"/>
    </linearGradient>
  </defs>
  <rect width="700" height="950" fill="#FFFFFF"/>

  <!-- ═══ Top: OLD WAY — marking answers ═══ -->
  <g transform="translate(190,60)">
    <!-- paper stack -->
    <rect x="30" y="60" width="230" height="150" rx="6" fill="#fff" stroke="#334155" stroke-width="2.5" transform="rotate(3 145 135)"/>
    <rect x="18" y="48" width="230" height="150" rx="6" fill="#fff" stroke="#334155" stroke-width="2.5" transform="rotate(-2 133 123)"/>
    <g>
      <line x1="35" y1="70" x2="150" y2="70" stroke="#94A3B8" stroke-width="2.5"/>
      <path d="M 165 62 l 6 8 l 14 -14" stroke="#1CA363" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="35" y1="98" x2="150" y2="98" stroke="#94A3B8" stroke-width="2.5"/>
      <path d="M 165 90 l 6 8 l 14 -14" stroke="#1CA363" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="35" y1="126" x2="150" y2="126" stroke="#94A3B8" stroke-width="2.5"/>
      <path d="M 160 112 l 18 18 M 178 112 l -18 18" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
      <line x1="35" y1="154" x2="120" y2="154" stroke="#94A3B8" stroke-width="2.5"/>
      <text x="185" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#EF4444">75%</text>
    </g>
    <!-- pencil marking -->
    <g transform="translate(-30,110) rotate(-32)">
      <rect x="0" y="0" width="90" height="12" rx="4" fill="#334155"/>
      <polygon points="90,0 108,6 90,12" fill="#EF4444"/>
      <rect x="-14" y="0" width="14" height="12" fill="#94A3B8"/>
    </g>
    <!-- score / trash -->
    <g transform="translate(30,232)">
      <path d="M 0 0 h 46 l -5 46 a 6 6 0 0 1 -6 6 h -24 a 6 6 0 0 1 -6 -6 Z" fill="none" stroke="#334155" stroke-width="2.5"/>
      <line x1="-6" y1="0" x2="52" y2="0" stroke="#334155" stroke-width="2.5"/>
      <line x1="16" y1="-8" x2="30" y2="-8" stroke="#334155" stroke-width="2.5"/>
      <text x="70" y="10" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#64748B" letter-spacing="1">SCORE</text>
    </g>
  </g>
  <text x="350" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B" letter-spacing="1">OLD WAY: MARKING ANSWERS</text>

  <!-- ═══ Magnifying glass + radiating cone ═══ -->
  <g transform="translate(350,400)">
    <circle cx="0" cy="0" r="42" fill="#fff" fill-opacity="0.5" stroke="url(#accT5)" stroke-width="6"/>
    <line x1="30" y1="30" x2="58" y2="58" stroke="url(#accT5)" stroke-width="9" stroke-linecap="round"/>
    <path d="M -70 120 L -42 0 L 42 0 L 70 120 Z" fill="url(#accT5)" opacity="0.08"/>
    <path d="M -42 0 L -70 120 M 42 0 L 70 120" stroke="url(#accT5)" stroke-width="1.6" stroke-dasharray="2 8" opacity="0.6"/>
  </g>

  <!-- ═══ Bottom: NEW WAY — understanding learning ═══ -->
  <g transform="translate(350,560)">
    <!-- oval bubble: understood concept -->
    <g transform="translate(-140,10)">
      <ellipse cx="0" cy="0" rx="86" ry="30" fill="none" stroke="url(#accT5)" stroke-width="2.2"/>
      <path d="M -58 0 l 7 8 l 14 -16" stroke="url(#accT5)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="12" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">understood concept</text>
    </g>

    <!-- cloud bubble with checkmark -->
    <g transform="translate(130,-30)">
      <path d="M -34 10 a 22 22 0 0 1 6 -43 a 26 26 0 0 1 50 -6 a 20 20 0 0 1 4 39 Z" fill="#fff" stroke="url(#accT5)" stroke-width="2.2"/>
      <path d="M -14 -6 l 8 9 l 18 -20" stroke="url(#accT5)" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-46" cy="30" r="5" fill="none" stroke="url(#accT5)" stroke-width="2"/>
      <circle cx="-58" cy="42" r="3" fill="none" stroke="url(#accT5)" stroke-width="2"/>
    </g>

    <!-- brain icon -->
    <g transform="translate(-30,95)">
      <path d="M -20 -6 a 12 12 0 0 1 20 -8 a 12 12 0 0 1 20 8 a 12 12 0 0 1 -4 22 a 12 12 0 0 1 -32 4 a 12 12 0 0 1 -4 -26 Z"
            fill="none" stroke="url(#accT5)" stroke-width="2.2"/>
      <path d="M 0 -14 v 30 M -8 -6 q 8 4 0 10 M 8 -6 q -8 4 0 10" stroke="url(#accT5)" stroke-width="1.6" fill="none"/>
    </g>

    <!-- gear + arrow bubble -->
    <g transform="translate(90,90)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="url(#accT5)" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="7" fill="none" stroke="url(#accT5)" stroke-width="2"/>
      <g stroke="url(#accT5)" stroke-width="2.4" stroke-linecap="round">
        <line x1="0" y1="-16" x2="0" y2="-11"/>
        <line x1="0" y1="16" x2="0" y2="11"/>
        <line x1="-16" y1="0" x2="-11" y2="0"/>
        <line x1="16" y1="0" x2="11" y2="0"/>
      </g>
      <path d="M 14 -14 l 8 -8 l 4 4 l -8 8 Z" fill="url(#accT5)"/>
    </g>

    <!-- connector dots -->
    <circle cx="-70" cy="60" r="3" fill="url(#accT5)" opacity="0.5"/>
    <circle cx="-50" cy="72" r="2" fill="url(#accT5)" opacity="0.5"/>
    <circle cx="40" cy="30" r="3" fill="url(#accT5)" opacity="0.5"/>
    <circle cx="55" cy="55" r="2" fill="url(#accT5)" opacity="0.5"/>

    <text x="0" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-style="italic" fill="url(#accT5)">Understanding Learning</text>
  </g>

  <text x="350" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B" letter-spacing="1">NEW WAY: UNDERSTANDING LEARNING</text>
</svg>
